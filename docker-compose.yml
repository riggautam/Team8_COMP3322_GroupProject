services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      TRUST_PROXY_HOPS: 1
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules/
            - .env
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./Dockerfile

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .env
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./Dockerfile
