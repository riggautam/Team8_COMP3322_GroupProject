services:
  backend:
    image: west-backend:latest
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: west-frontend:latest
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
