server {
    listen 443 ssl;
    server_name c3322-pg08.cs.hku.hk;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Don't show the Nginx version in headers and error pages.
    server_tokens off;

    # Security headers for every response, error pages included ("always").
    # nosniff: browsers must not guess a file's type, e.g. run an upload as a script.
    # DENY: no other site may show WEST inside a frame (stops click-jacking).
    # Referrer-Policy: other sites only see "c3322-pg08.cs.hku.hk", never the full page address.
    # Permissions-Policy: only WEST itself may ask for location (the map); no camera or microphone.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location /api/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
